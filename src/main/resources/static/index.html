<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Analyzer</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-alt: #eef4ff;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    .container { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 20px;}
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.4rem; }
    .brand-mark { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; display: grid; place-items: center; box-shadow: var(--shadow); font-size: 1.2rem; }
    
    .toolbar { display: flex; gap: 12px; align-items: center; }
    .pill { border: 1px solid var(--border); background: white; border-radius: 999px; padding: 10px 14px; color: var(--muted); font-size: 0.9rem; font-weight: 600; }
    
    .primary-btn, .secondary-btn { border: none; border-radius: 12px; padding: 12px 16px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .primary-btn { background: var(--primary); color: white; box-shadow: 0 10px 16px rgba(59,130,246,0.25); }
    .primary-btn:hover { background: var(--primary-dark); }
    .secondary-btn { background: var(--panel-alt); color: var(--primary-dark); }
    
    .grid { display: grid; grid-template-columns: 340px 1fr; gap: 24px; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 22px; }
    .section-title { margin: 0 0 18px; font-size: 1.1rem; font-weight: 700; }
    
    form { display: grid; gap: 14px; }
    .field { display: grid; gap: 6px; }
    label { font-size: 0.87rem; font-weight: 600; color: var(--muted); }
    input, select, textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font: inherit; outline: none; transition: 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: rgba(59,130,246,0.5); box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
    textarea { min-height: 80px; resize: vertical; }
    .form-actions { display: flex; gap: 10px; margin-top: 8px; }
    
    .stats { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat { padding: 18px; border-radius: 18px; border: 1px solid var(--border); background: linear-gradient(180deg, #fff, #f8fbff); }
    .stat label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .stat .value { font-size: 1.8rem; font-weight: 800; color: var(--text); }
    .mini { display: inline-block; margin-top: 10px; font-size: 0.82rem; color: var(--success); font-weight: 700; }
    
    .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 18px; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; color: var(--muted); font-size: 0.78rem; text-transform: uppercase; font-weight: 700; }
    tbody tr:hover { background: rgba(59,130,246,0.02); }
    
    .category-tag { padding: 6px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: rgba(59,130,246,0.12); color: var(--primary-dark); }
    .amount.negative { color: var(--danger); font-weight: 700; }
    
    .table-actions { display: flex; gap: 8px; }
    .small-btn { border: none; cursor: pointer; padding: 7px 10px; border-radius: 8px; font-weight: 600; }
    .edit-btn { background: rgba(59,130,246,0.12); color: var(--primary-dark); }
    .delete-btn { background: rgba(239,68,68,0.1); color: var(--danger); }
    
    .alert { display: none; margin-top: 14px; padding: 12px; border-radius: 12px; font-size: 0.92rem; font-weight: 600; }
    .alert.show { display: block; }
    .alert.success { background: rgba(16,185,129,0.12); color: #047857; }
    .alert.error { background: rgba(239,68,68,0.12); color: #b91c1c; }
    
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">₹</div> Expense Analyzer</div>
      <div class="toolbar">
        <div class="pill" id="syncStatus">Backend: Checking...</div>
        <button class="secondary-btn" id="refreshBtn">Refresh Data</button>
      </div>
    </header>

    <main class="grid">
      <section class="panel">
        <h2 class="section-title" id="formTitle">Add Expense</h2>
        <form id="expenseForm">
          <input type="hidden" id="expenseId" />

          <div class="field">
            <label>Title</label>
            <input id="title" type="text" placeholder="e.g. Groceries" required />
          </div>

          <div class="field">
            <label>Amount</label>
            <input id="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required />
          </div>

          <div class="field">
            <label>Category</label>
            <select id="category" required>
              <option value="">Select a category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Travel">Travel</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label>Payment Method</label>
            <select id="paymentMethod" required>
              <option value="Cash">Cash</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="UPI">UPI / Bank Transfer</option>
            </select>
          </div>

          <div class="field">
            <label>Date</label>
            <input id="date" type="date" required />
          </div>

          <div class="field">
            <label>Notes</label>
            <textarea id="notes" placeholder="Optional details"></textarea>
          </div>

          <div class="form-actions">
            <button class="primary-btn" type="submit" id="submitBtn">Save Expense</button>
            <button class="secondary-btn" type="button" id="cancelEditBtn" style="display:none;">Cancel</button>
          </div>
        </form>
        <div id="formAlert" class="alert"></div>
      </section>

      <section>
        <div class="stats">
          <div class="stat"><label>Total Spent</label><div class="value" id="totalSpent">₹0.00</div><span class="mini">All records</span></div>
          <div class="stat"><label>Monthly Spend</label><div class="value" id="monthlySpent">₹0.00</div><span class="mini" id="monthLabel">This month</span></div>
          <div class="stat"><label>Top Category</label><div class="value" id="topCategory">-</div><span class="mini" id="topCategoryValue">₹0.00</span></div>
          <div class="stat"><label>Average</label><div class="value" id="averageExpense">₹0.00</div><span class="mini">Per expense</span></div>
        </div>

        <div class="panel">
          <h2 class="section-title">Expense List</h2>
          <div class="filters">
            <select id="filterCategory">
              <option value="all">All categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Travel">Travel</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
            <input id="filterMonth" type="month" />
            <input id="searchInput" type="text" placeholder="Search title or notes" />
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Payment</th>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Notes</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="expenseTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const apiBase = '/api/transactions';
    let expenses = [];
    const elements = {
      form: document.getElementById('expenseForm'), title: document.getElementById('title'), amount: document.getElementById('amount'),
      category: document.getElementById('category'), paymentMethod: document.getElementById('paymentMethod'), date: document.getElementById('date'),
      notes: document.getElementById('notes'), expenseId: document.getElementById('expenseId'), submitBtn: document.getElementById('submitBtn'),
      cancelEditBtn: document.getElementById('cancelEditBtn'), formTitle: document.getElementById('formTitle'), formAlert: document.getElementById('formAlert'),
      tableBody: document.getElementById('expenseTableBody'), filterCategory: document.getElementById('filterCategory'),
      filterMonth: document.getElementById('filterMonth'), searchInput: document.getElementById('searchInput'), syncStatus: document.getElementById('syncStatus')
    };

    const currency = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(val || 0);

    function showAlert(msg, type = 'success') {
      elements.formAlert.textContent = msg;
      elements.formAlert.className = `alert show ${type}`;
      setTimeout(() => elements.formAlert.className = 'alert', 3000);
    }

    function setSyncStatus(online) {
      elements.syncStatus.textContent = online ? 'Backend: Online' : 'Backend: Offline';
      elements.syncStatus.style.color = online ? '#047857' : '#b91c1c';
      elements.syncStatus.style.background = online ? 'rgba(16,185,129,0.12)' : 'rgba(239,68,68,0.12)';
    }

    function normalize(item) {
      const desc = item.description || 'Untitled';
      const parts = desc.includes(' | ') ? desc.split(' | ') : [desc, ''];
      return {
        id: item.id, title: parts[0], amount: Number(item.amount || 0),
        category: item.category || 'Other', paymentMethod: item.paymentMethod || 'Cash',
        date: item.date || '-', notes: parts[1], type: item.type || 'EXPENSE'
      };
    }

    function computeSummary(filtered) {
      const total = filtered.reduce((sum, item) => sum + item.amount, 0);
      const currMonth = elements.filterMonth.value || new Date().toISOString().slice(0,7);
      const monthTotal = filtered.filter(i => i.date.startsWith(currMonth)).reduce((sum, item) => sum + item.amount, 0);
      
      const catMap = {};
      filtered.forEach(i => catMap[i.category] = (catMap[i.category] || 0) + i.amount);
      let topCat = '-', topVal = 0;
      for (const [cat, val] of Object.entries(catMap)) { if (val > topVal) { topCat = cat; topVal = val; } }

      document.getElementById('totalSpent').textContent = currency(total);
      document.getElementById('monthlySpent').textContent = currency(monthTotal);
      document.getElementById('averageExpense').textContent = currency(filtered.length ? total / filtered.length : 0);
      document.getElementById('topCategory').textContent = topCat;
      document.getElementById('topCategoryValue').textContent = currency(topVal);
    }

    function renderTable() {
      const cat = elements.filterCategory.value;
      const mon = elements.filterMonth.value;
      const search = elements.searchInput.value.toLowerCase();
      
      const filtered = expenses.filter(i => 
        (cat === 'all' || i.category === cat) &&
        (!mon || i.date.startsWith(mon)) &&
        (!search || `${i.title} ${i.notes}`.toLowerCase().includes(search)) &&
        (i.type === 'EXPENSE')
      );

      elements.tableBody.innerHTML = filtered.length ? filtered.map(i => `
        <tr>
          <td style="font-weight:600;">${i.title}</td>
          <td><span class="category-tag">${i.category}</span></td>
          <td style="font-size:0.85rem; color:#64748b;">${i.paymentMethod}</td>
          <td>${i.date}</td>
          <td class="amount negative">${currency(i.amount)}</td>
          <td style="font-size:0.85rem; color:#64748b;">${i.notes || '-'}</td>
          <td>
            <div class="table-actions">
              <button class="small-btn edit-btn" onclick="editExpense(${i.id})">Edit</button>
              <button class="small-btn delete-btn" onclick="deleteExpense(${i.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('') : `<tr><td colspan="7" style="text-align:center; padding: 20px; color:#64748b;">No expenses found.</td></tr>`;
      
      computeSummary(filtered);
    }

    async function loadData() {
      try {
        const res = await fetch(apiBase);
        if (!res.ok) throw new Error();
        expenses = (await res.json()).map(normalize);
        setSyncStatus(true);
        renderTable();
      } catch (e) {
        expenses = [];
        setSyncStatus(false);
        renderTable();
      }
    }

    elements.form.onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        type: "EXPENSE", amount: Number(elements.amount.value), category: elements.category.value,
        paymentMethod: elements.paymentMethod.value, date: elements.date.value,
        description: elements.title.value.trim() + (elements.notes.value.trim() ? " | " + elements.notes.value.trim() : "")
      };
      
      const id = elements.expenseId.value;
      try {
        const res = await fetch(id ? `${apiBase}/${id}` : apiBase, {
          method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Failed to save to database');
        resetForm();
        showAlert('Saved successfully!');
        loadData();
      } catch (err) { showAlert(err.message, 'error'); }
    };

    window.deleteExpense = async (id) => {
      if (!confirm('Delete this expense?')) return;
      try {
        const res = await fetch(`${apiBase}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete');
        showAlert('Deleted successfully!');
        loadData();
      } catch (err) { showAlert(err.message, 'error'); }
    };

    window.editExpense = (id) => {
      const item = expenses.find(i => i.id === id);
      if (!item) return;
      elements.expenseId.value = item.id; elements.title.value = item.title; elements.amount.value = item.amount;
      elements.category.value = item.category; elements.paymentMethod.value = item.paymentMethod;
      elements.date.value = item.date; elements.notes.value = item.notes;
      elements.formTitle.textContent = 'Edit Expense'; elements.submitBtn.textContent = 'Update';
      elements.cancelEditBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function resetForm() {
      elements.form.reset(); elements.expenseId.value = ''; elements.date.value = new Date().toISOString().slice(0,10);
      elements.formTitle.textContent = 'Add Expense'; elements.submitBtn.textContent = 'Save Expense';
      elements.cancelEditBtn.style.display = 'none';
    }

    elements.cancelEditBtn.onclick = resetForm;
    document.getElementById('refreshBtn').onclick = loadData;
    ['filterCategory', 'filterMonth', 'searchInput'].forEach(id => document.getElementById(id).oninput = renderTable);
    
    elements.date.value = new Date().toISOString().slice(0, 10);
    elements.filterMonth.value = new Date().toISOString().slice(0, 7);
    loadData();
  </script>
</body>
</html>
